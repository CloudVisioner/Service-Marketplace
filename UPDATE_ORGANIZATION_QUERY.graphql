# ============================================
# UPDATE ORGANIZATION - MINIMALISTIC
# ============================================

mutation UpdateOrganization($input: OrganizationUpdate!) {
  updateOrganization(input: $input) {
    _id
    orgName
    categoryId
    subCategory
    startingRate
    minProjectSize
    orgCountry
    orgCity
    orgWebsiteUrl
    orgDescription
    orgSkills
    orgTaxId
    orgLogoImages
    updatedAt
  }
}


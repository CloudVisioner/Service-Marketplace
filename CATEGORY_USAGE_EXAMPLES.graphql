# ============================================
# CATEGORY AND SUBCATEGORY USAGE EXAMPLES
# ============================================

# ============================================
# UPDATE ORGANIZATION - Set Category & Subcategory
# ============================================

mutation UpdateOrganization($input: OrganizationUpdate!) {
  updateOrganization(input: $input) {
    _id
    orgName
    categoryId
    subCategory
  }
}


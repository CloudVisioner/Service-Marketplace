# ============================================
# COMPLETE FLOW: Get Organization ID → Update Organization
# ============================================

# ============================================
# STEP 1: GET YOUR ORGANIZATION ID
# ============================================
# This query returns all organizations owned by the logged-in user
# You'll get the _id from the response

query GetMyOrganizations {
  getMyOrganizations {
    _id                    # ← THIS IS THE ID YOU NEED!
    orgName
    orgType
    orgStatus
    categoryId
    subCategory
    serviceTitle
    startingRate
    minProjectSize
    establishmentYear
    teamSize
    industries
    location
    flag
    avatar
    badges
    color
    bio
    email
    phone
    linkedIn
    twitter
    github
    orgCountry
    orgCity
    orgWebsiteUrl
    orgSkills
    orgLogoImages
    orgVerified
    createdAt
    updatedAt
  }
}

# Headers Required:
# Authorization: Bearer YOUR_ACCESS_TOKEN

# Response Example:
# {
#   "data": {
#     "getMyOrganizations": [
#       {
#         "_id": "69864f6efcf99b93d1eca978",  ← COPY THIS ID!
#         "orgName": "My Company",
#         "categoryId": null,
#         "subCategory": null,
#         "startingRate": null
#       }
#     ]
#   }
# }

# ============================================
# STEP 2: UPDATE ORGANIZATION USING THE ID
# ============================================
# Use the _id from Step 1 in the input

mutation UpdateOrganization($input: OrganizationUpdate!) {
  updateOrganization(input: $input) {
    _id
    orgName
    categoryId
    subCategory
    serviceTitle
    startingRate
    minProjectSize
    establishmentYear
    teamSize
    industries
    location
    flag
    avatar
    badges
    color
    bio
    email
    phone
    linkedIn
    twitter
    github
    orgCountry
    orgCity
    orgWebsiteUrl
    orgSkills
    orgLogoImages
    orgVerified
    createdAt
    updatedAt
  }
}

# Variables Example:
# {
#   "input": {
#     "_id": "69864f6efcf99b93d1eca978",  ← PASTE THE ID FROM STEP 1
#     "categoryId": "web-development",
#     "subCategory": "e-commerce",
#     "startingRate": 5000,
#     "minProjectSize": 10000
#   }
# }

# Headers Required:
# Authorization: Bearer YOUR_ACCESS_TOKEN

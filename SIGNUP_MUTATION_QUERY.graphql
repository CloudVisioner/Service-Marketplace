# ============================================
# SIGNUP MUTATION - MINIMALISTIC REQUEST
# ============================================

mutation Signup($input: SignupInput!) {
  signup(input: $input) {
    accessToken
    user {
      _id
      userEmail
      userNick
      userRole
      deletedAt
      createdAt
      updatedAt
    }
  }
}

# ============================================
# VARIABLES (Minimal - Only Required Fields)
# ============================================
# {
#   "input": {
#     "userEmail": "azamat@example.com",
#     "userNick": "azamat_kim",
#     "userPassword": "123456"
#   }
# }

# ============================================
# VARIABLES (With Role - Optional, Defaults to BUYER)
# ============================================
# {
#   "input": {
#     "userEmail": "azamat@example.com",
#     "userNick": "azamat_kim",
#     "userPassword": "123456",
#     "userRole": "BUYER"
#   }
# }

# ============================================
# VARIABLES (Provider Role)
# ============================================
# {
#   "input": {
#     "userEmail": "provider@example.com",
#     "userNick": "provider_name",
#     "userPassword": "123456",
#     "userRole": "PROVIDER"
#   }
# }

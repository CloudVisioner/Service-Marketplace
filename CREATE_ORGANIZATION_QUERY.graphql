# ============================================
# CREATE ORGANIZATION - MINIMALISTIC
# ============================================

mutation CreateOrganization($input: OrganizationInput!) {
  createOrganization(input: $input) {
    _id
    orgName
    orgType
    orgStatus
    createdAt
    updatedAt
  }
}

# ============================================
# VARIABLES EXAMPLES
# ============================================


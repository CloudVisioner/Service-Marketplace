# ============================================
# UPDATE PROVIDER INFORMATION
# ============================================
# Use Case: Provider updates their marketplace profile information
# Auth Required: Yes (PROVIDER role)
# Note: Provider can only update their own organization

mutation UpdateOrganization($input: OrganizationUpdate!) {
  updateOrganization(input: $input) {
    _id
    orgName
    orgDescription
    bio
    categoryId
    subCategory
    serviceTitle
    startingRate
    minProjectSize
    establishmentYear
    teamSize
    industries
    location
    flag
    avatar
    badges
    color
    email
    phone
    linkedIn
    twitter
    github
    orgCountry
    orgCity
    orgWebsiteUrl
    orgSkills
    orgLogoImages
    orgVerified
    createdAt
    updatedAt
  }
}

